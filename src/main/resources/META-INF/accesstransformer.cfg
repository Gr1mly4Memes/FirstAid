# FirstAid access transformers for Minecraft 26.2 / NeoForge 26.2.0.82
# 26.1+ is fully deobfuscated (official Mojang names), so SRG names (f_/m_) are gone.
# Dropped 1.20.1 entries with no 26.2 target:
# - net.minecraft.client.gui.Gui health fields (tickCount, lastHealth, lastHealthTime,
#   displayHealth, healthBlinkTime, random): Gui was refactored, health rendering moved
#   to the Hud/GuiRenderState pipeline. FirstaidIngameGui must be rewritten, no AT possible.
# - SynchedEntityData setEntryValue/getEntry: methods no longer exist; getItem is private
#   and construction is Builder-based, so SynchedEntityDataWrapper needs a rewrite.
# - EnchantmentHelper runIterationOnItem/EnchantmentVisitor: now public, no AT needed.
#   NOTE: signature changed to runIterationOnItem(ItemStack, EnchantmentVisitor), and the
#   visitor now takes (Holder<Enchantment>, int). See ArmorUtils usage to fix.
# - ServerLevel allPlayersSleeping: field removed (replaced by SleepStatus sleepStatus),
#   no code usage in this mod.

# Needed to swap in SynchedEntityDataWrapper (EventHandler, CommonUtils, PlayerDamageModel)
public-f net.minecraft.world.entity.Entity entityData

# Needed: private static final DATA_HEALTH_ID, accessed via LivingEntity (and via Player in code)
public net.minecraft.world.entity.LivingEntity DATA_HEALTH_ID

# Needed: private static final DATA_PLAYER_ABSORPTION_ID in Player
public net.minecraft.world.entity.player.Player DATA_PLAYER_ABSORPTION_ID

# Needed: private checkTotemDeathProtection, called from CommonUtils
public net.minecraft.world.entity.LivingEntity checkTotemDeathProtection(Lnet/minecraft/world/damagesource/DamageSource;)Z
