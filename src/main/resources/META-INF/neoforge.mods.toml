# First Aid mod definition file
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ichttt/FirstAid"
displayURL="https://minecraft.curseforge.com/projects/first-aid"
bannerFile="firstaid_logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="First Aid is a game changing mod focused around a new health system"
credits="Thanks to TechnikForLife for developing the initial idea with me, and thanks to rozarke for designing the new textures for FirstAid!"
authors="${mod_authors}"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playerrevive"
type="optional"
versionRange="[2.0.24,)"
ordering="NONE"
side="BOTH"
